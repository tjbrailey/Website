baseurl = "https://tjbrailey.org"
title = ""

theme = "hugo-coder"

languagecode = "en"
defaultcontentlanguage = "en"

paginate = 20
canonifyurls = true
math = true

pygmentsstyle = "b2"
pygmentscodefences = true
pygmentscodefencesguesssyntax = true

#disqusShortname = "yourdiscussshortname"

[params]
    author = "Thomas J. Brailey"
    description = "Tom Brailey's personal website"
    keywords = "research associate,political science,personal"
    info = "PhD Candidate (Nuffield College, University of Oxford)"
    avatarURL = "images/tb_headshot.jpg"
    dateformat = "January 2, 2006"

    hideCredits = false
    hideCopyright = false
    since = 2019

    # Git Commit in Footer, uncomment the line below to enable it.
    commit = "https://github.com/luizdepra/hugo-coder/tree/"

    rtl = false

    # Specify light/dark colorscheme
    # Supported values:
    # "auto" (use preference set by browser)
    # "dark" (dark background, light foreground)
    # "light" (light background, dark foreground) (default)
    colorscheme = "light"

    # Series see also post count
    maxSeeAlsoItems = 5

    email = "thomas.brailey@nuffield.ox.ac.uk"

    # Custom CSS
    custom_css = ["css/custom.css"]

    # Custom JS
    custom_js = []

# If you want to use fathom(https://usefathom.com) for analytics, add this section
[params.fathomAnalytics]
    siteID = "ABCDE"
    # Default value is cdn.usefathom.com, overwrite this if you are self-hosting
    serverURL = "analytics.example.com"

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"

[[params.social]]
    name = "Github"
    icon = "fab fa-github"
    weight = 1
    url = "https://github.com/tjbrailey/"

[[params.social]]
    name = "LinkedIn"
    icon = "fab fa-linkedin"
    weight = 2
    url = "https://www.linkedin.com/in/tjbrailey/"

[[params.social]]
    name = "Email"
    icon = "fas fa-envelope"
    weight = 3
    url = "mailto:thomas.brailey@nuffield.ox.ac.uk"

[[params.social]]
    name = "CV"
    weight = 4
    url = "/files/tb_cv.pdf"
    target = "_blank"

[[params.social]]
    name = "Consulting"
    icon = "fas fa-briefcase"
    weight = 5
    url = "https://docs.google.com/forms/d/1tp1jNRNpip4RRQDhypXXhZbYM3NXZgyHjr62Z3dBEqE/edit"
    target = "_blank"


[languages]
    [languages.en]
        languagename = "English"


[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
